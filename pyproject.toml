[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-cognitive-engine-lab"
version = "0.1.0"
description = "Local laboratory for user-adapted voice endpointing and continuous cognitive systems"
requires-python = ">=3.11"

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.1",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
cognitive-lab = "cognitive_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
